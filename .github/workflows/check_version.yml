name: Check new version

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 1 * *' # every month first day

jobs:
  check_version:
    permissions:
      contents: write
      pull-requests: write
    uses: mpvkit/BuildShared/.github/workflows/check_version.yml@2aa2c4cc38aa8fbf001eeaebaae13de1e14ea24f
    secrets: inherit
    with:
      repository: 'libass/libass'
      library: 'libass'
